name: Unzip Images
on:
  push:
    paths:
      - 'images.zip'
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Unzip file
        run: |
          unzip -o images.zip -d images/
          rm images.zip
      - name: Commit unzipped images
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto unzip images"
